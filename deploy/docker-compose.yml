name: xiaozhe-ecommerce

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_demo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

  ecommerce-backend:
    build:
      context: ../ecommerce-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-agent_demo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      SPRING_PROFILES_ACTIVE: course-debug
      AGENT_SERVICE_BASE_URL: ${AGENT_SERVICE_BASE_URL:-http://host.docker.internal:8000}
      AGENT_SERVICE_AUTH_TOKEN: ${AGENT_SERVICE_AUTH_TOKEN:?AGENT_SERVICE_AUTH_TOKEN is required}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${ECOMMERCE_BACKEND_PORT:-8081}:8081"

  ecommerce-frontend:
    build:
      context: ../ecommerce-frontend
    depends_on:
      - ecommerce-backend
    ports:
      - "${ECOMMERCE_FRONTEND_PORT:-5174}:80"

volumes:
  mysql-data:
