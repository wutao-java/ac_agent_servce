server:
  port: 8000
  host: 127.0.0.1
  logger:
    file: logs/app.log
    level: INFO

ai:
  openai:
    model: qwen3.8-max
    api-key: "${AGENT_CENTER_AI_API_KEY}"
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    temperature: 0.3
    timeout: 60
  agent:
    checkpointer:
      postgres:
        min: 1
        max: 10
        url: "${AGENT_CENTER_POSTGRES_URL}"

ecommerce:
  base-url: "${ECOMMERCE_BACKEND_BASE_URL}"
  service-token: "${AGENT_SERVICE_AUTH_TOKEN}"
  connect-timeout: 2
  read-timeout: 20
